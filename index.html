    <!--
      Instant first paint. The SPA needs ~1 s to download/evaluate its bundle;
      this lightweight splash paints the brand immediately and is removed by
      src/index.tsx as soon as the app is mounted. It is a fixed overlay, so
      removing it does not cause layout shift.
    -->
    <style>
        #boot-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0a11;
            color: #fff;
            font-family: Inter, 'SF Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
            transition: opacity 250ms ease-out;
        }
        #boot-splash.boot-hide { opacity: 0; pointer-events: none; }
        #boot-splash .vj-logo-shine {
            width: min(220px, 60vw);
            aspect-ratio: 1;
        }
        #boot-splash .vj-logo-shine > img {
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45));
        }
        .vj-logo-shine {
            position: relative;
            display: inline-block;
        }
        .vj-logo-shine > img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .vj-logo-sweep {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                115deg,
                transparent 32%,
                rgba(242, 182, 61, 0.95) 44%,
                rgba(69, 124, 214, 0.95) 50%,
                rgba(227, 66, 98, 0.95) 56%,
                transparent 68%
            );
            background-size: 250% 100%;
            background-repeat: no-repeat;
            -webkit-mask-image: var(--vj-logo);
            mask-image: var(--vj-logo);
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            animation: vj-logo-sweep 2.2s linear infinite;
            opacity: 0.9;
        }
        @keyframes vj-logo-sweep {
            from { background-position: 200% 0; }
            to { background-position: -100% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-splash { transition: none; }
            .vj-logo-sweep { animation: none; opacity: 0; }
        }
    </style>
